<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Wallen Club Lambs</title>

  <!-- iPhone / iOS home screen icon + full-screen app behavior -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Wallen Club Lambs" />
  <meta name="theme-color" content="#0F1115" />

  <!-- Favicon (desktop browser tab) -->
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />

  <!-- Android / general web app manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- Styling is bundled locally (no CDN) so the app works with no internet connection -->
  <link rel="stylesheet" href="./tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100vh; }
    /* Cover screen (shown once per day, then skipped) */
    #gsc-cover { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding: 24px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 38%, #18244A 0%, #0F1115 55%, #08090C 100%); transition: opacity .45s ease; }
    #gsc-cover.gsc-hide { opacity: 0; pointer-events: none; }
    #gsc-cover img { width: min(86vw, 580px); height: auto; display: block; }
    #gsc-cover button { font-family: 'Inter', -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #FFFFFF; background: linear-gradient(180deg, #3E64C8, #1C3F99); border: 0; border-radius: 999px; padding: 15px 56px; min-height: 48px; cursor: pointer; box-shadow: 0 6px 22px rgba(0,0,0,.45); }
    #gsc-cover button:active { transform: scale(.97); }

  </style>
</head>
<body>
  <div id="gsc-cover" style="display:none">
    <img src="./logo-cover.png" alt="Wallen Club Lambs" />
    <button id="gsc-cover-open" type="button">Open</button>
  </div>
  <script>
    // Cover shows on the first open of each day. Only a UI convenience:
    // if storage is unavailable it simply shows every time.
    (function () {
      var el = document.getElementById("gsc-cover");
      var today = new Date();
      var key = today.getFullYear() + "-" + (today.getMonth() + 1) + "-" + today.getDate();
      var seen = false;
      try { seen = localStorage.getItem("wcl:cover:day") === key; } catch (e) {}
      /* cover shows every time the app opens */
      el.style.display = "flex";
      document.getElementById("gsc-cover-open").addEventListener("click", function () {
        try { localStorage.setItem("wcl:cover:day", key); } catch (e) {}
        el.className = "gsc-hide";
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
      });
    })();
  </script>
  <div id="root"></div>
  <!-- Bundled locally (no CDN) so cross-device sync still works after the first
       load even with no internet connection; see sync.js for how it's used. -->
  <script>
    // PDF packet builder loads only when Generate PDF is tapped (keeps app start fast).
    function gscLoad(src) {
      return new Promise(function (res, rej) {
        var s = document.createElement("script");
        s.src = src; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    // Excel export needs only the section builder.
    window.gscLoadPacket = function () {
      if (window.gscSheets) return Promise.resolve();
      return gscLoad("./pdfpacket.js");
    };
    window.gscLoadPdf = function () {
      var a = window.jspdf ? Promise.resolve() : gscLoad("./jspdf.umd.min.js");
      return a.then(function () { return window.gscSheets ? null : gscLoad("./pdfpacket.js"); });
    };
  </script>
  <script src="./firebase-vendor.js"></script>
  <script src="./sync.js"></script>
  <script src="./bundle.js"></script>
  <script>
    // Registers the service worker so the app shell (HTML/CSS/JS/icons) is cached
    // and keeps working with no internet connection after the first successful load.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
